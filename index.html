<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">&#9776;</button>
      <h1>Inventory</h1>
      <div class="spacer"></div>
    </header>

    <nav id="sideMenu" class="side-menu">
      <button class="menu-item active" data-view="checkStocks">Check Stocks</button>
      <button class="menu-item" data-view="receiving">Receiving</button>
      <button class="menu-item" data-view="issuance">Issuance</button>
    </nav>
    <div id="overlay" class="overlay"></div>

    <main id="content">
      <!-- Check Stocks (untouched) -->
      <section id="view-checkStocks" class="view active">
        <div class="card">
          <h2>Check Stocks</h2>
          <div class="row">
            <button id="startScanCheck" class="btn btn-primary">Scan Item</button>
          </div>
          <div class="manual-entry row">
            <input id="manualCode" type="text" placeholder="Or type / scan Item Code" />
            <button id="manualCodeGo" class="btn btn-ghost">Enter</button>
          </div>
          <div id="stockResult" class="result-card hidden"></div>
        </div>
      </section>

      <!-- Receiving -->
      <section id="view-receiving" class="view">
        <div class="card">
          <h2>Receiving</h2>
          <label class="field">Issued/Received Date <span class="hint">(applies to every item below)</span>
            <input type="date" id="receiving-date" required />
          </label>

          <div class="line-entry">
            <label class="field">Enhanced Item
              <div class="row">
                <div class="combo" id="receiving-item-combo">
                  <input type="text" class="combo-input" id="receiving-item-input" placeholder="Type to search item..." autocomplete="off" />
                  <input type="hidden" id="receiving-item-value" />
                  <div class="combo-list hidden" id="receiving-item-list"></div>
                </div>
                <button type="button" class="btn btn-ghost scan-item-btn" data-target="receiving-item">Scan</button>
              </div>
              <div id="receiving-item-error" class="field-error hidden"></div>
            </label>
            <div class="row">
              <label class="field">Unit Price<input type="number" id="receiving-unitPrice" step="0.01" min="0" /></label>
              <label class="field">QTY<input type="number" id="receiving-qty" step="1" min="1" /></label>
            </div>
            <div class="row">
              <label class="field">LOB
                <select id="receiving-lob">
                  <option value="">Select LOB</option>
                  <option value="ACP">ACP</option>
                  <option value="GCP">GCP</option>
                  <option value="SCP">SCP</option>
                </select>
              </label>
              <label class="field">Completed
                <select id="receiving-completed">
                  <option value="YES">YES</option>
                  <option value="NO">NO</option>
                </select>
              </label>
            </div>
            <label class="field">Photo <span class="hint">(optional)</span>
              <input type="file" id="receiving-photo" accept="image/*" capture="environment" />
            </label>
            <div id="receiving-photo-preview" class="photo-preview hidden"></div>
            <button type="button" id="receiving-add" class="btn btn-primary">+ Add to List</button>
          </div>

          <div class="pending-list">
            <h3>Items to submit (<span id="receiving-count">0</span>)</h3>
            <div class="table-wrap">
              <table id="receiving-table" class="line-table">
                <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>LOB</th><th>Done</th><th>Photo</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <button type="button" id="receiving-submit-all" class="btn btn-primary" disabled>Submit All</button>
          </div>
          <div id="msg-receiving" class="msg hidden"></div>
        </div>
      </section>

      <!-- Issuance -->
      <section id="view-issuance" class="view">
        <div class="card">
          <h2>Issuance</h2>
          <label class="field">Issued/Received Date <span class="hint">(applies to every item below)</span>
            <input type="date" id="issuance-date" required />
          </label>

          <div class="line-entry">
            <label class="field">Enhanced Item
              <div class="row">
                <div class="combo" id="issuance-item-combo">
                  <input type="text" class="combo-input" id="issuance-item-input" placeholder="Type to search item..." autocomplete="off" />
                  <input type="hidden" id="issuance-item-value" />
                  <div class="combo-list hidden" id="issuance-item-list"></div>
                </div>
                <button type="button" class="btn btn-ghost scan-item-btn" data-target="issuance-item">Scan</button>
              </div>
              <div id="issuance-item-error" class="field-error hidden"></div>
            </label>
            <div class="row">
              <label class="field">Unit Price<input type="number" id="issuance-unitPrice" step="0.01" min="0" /></label>
              <label class="field">QTY<input type="number" id="issuance-qty" step="1" min="1" /></label>
            </div>
            <div class="row">
              <label class="field">LOB
                <select id="issuance-lob">
                  <option value="">Select LOB</option>
                  <option value="ACP">ACP</option>
                  <option value="GCP">GCP</option>
                  <option value="SCP">SCP</option>
                </select>
              </label>
              <label class="field">Completed
                <select id="issuance-completed">
                  <option value="YES">YES</option>
                  <option value="NO">NO</option>
                </select>
              </label>
            </div>
            <label class="field">Photo <span class="hint">(optional)</span>
              <input type="file" id="issuance-photo" accept="image/*" capture="environment" />
            </label>
            <div id="issuance-photo-preview" class="photo-preview hidden"></div>
            <button type="button" id="issuance-add" class="btn btn-primary">+ Add to List</button>
          </div>

          <div class="pending-list">
            <h3>Items to submit (<span id="issuance-count">0</span>)</h3>
            <div class="table-wrap">
              <table id="issuance-table" class="line-table">
                <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>LOB</th><th>Done</th><th>Photo</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <button type="button" id="issuance-submit-all" class="btn btn-primary" disabled>Submit All</button>
          </div>
          <div id="msg-issuance" class="msg hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Shared scanner modal, used by all three views -->
  <div id="scannerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="scannerTitle">Scan</h3>
        <button id="closeScanner" class="icon-btn" aria-label="Close">&#10005;</button>
      </div>
      <div id="scannerRegion" class="scanner-box"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
