<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">&#9776;</button>
      <h1>Inventory</h1>
      <div class="spacer"></div>
    </header>

    <nav id="sideMenu" class="side-menu">
      <button class="menu-item" data-view="checkStocks">Check Stocks</button>
      <button class="menu-item" data-view="receiving">Receiving</button>
      <button class="menu-item" data-view="issuance">Issuance</button>
    </nav>
    <div id="overlay" class="overlay"></div>

    <!-- Shared list of items, used by the type-to-search fields in Receiving/Issuance -->
    <datalist id="itemsDatalist"></datalist>

    <main id="content">
      <!-- Check Stocks -->
      <section id="view-checkStocks" class="view">
        <div class="card">
          <h2>Check Stocks</h2>
          <a id="checkstocks-sheet-link" class="sheet-link hidden" href="#" target="_blank" rel="noopener">Open item list in Smartsheet &#8599;</a>
          <div class="row">
            <button id="startScanCheck" class="btn btn-primary">Scan Item</button>
          </div>
          <div class="manual-entry row">
            <input id="manualCode" type="text" placeholder="Or type / scan Item Code" />
            <button id="manualCodeGo" class="btn btn-ghost">Enter</button>
          </div>
          <div id="stockResult" class="result-card hidden"></div>
        </div>
      </section>

      <!-- Receiving -->
      <section id="view-receiving" class="view">
        <div class="card">
          <h2>Receiving</h2>
          <a id="receiving-sheet-link" class="sheet-link hidden" href="#" target="_blank" rel="noopener">Open transactions sheet in Smartsheet &#8599;</a>

          <div class="field">
            <label for="receiving-date">Issued/Received Date <span class="hint">(applies to every item below)</span></label>
            <input type="date" id="receiving-date" required />
          </div>

          <div class="field">
            <label for="receiving-attachment">Attachment <span class="hint">(optional — photo/receipt)</span></label>
            <input type="file" id="receiving-attachment" accept="image/*,.pdf" />
          </div>

          <div class="line-entry">
            <div class="field">
              <label for="receiving-item">Enhanced Item</label>
              <div class="row">
                <input type="text" id="receiving-item" class="item-select" list="itemsDatalist" placeholder="Type to search item..." autocomplete="off" />
                <button type="button" class="btn btn-ghost scan-item-btn" data-target="receiving-item">Scan</button>
              </div>
            </div>
            <div class="row">
              <div class="field"><label for="receiving-unitPrice">Unit Price</label><input type="number" id="receiving-unitPrice" step="0.01" min="0" /></div>
              <div class="field"><label for="receiving-qty">QTY</label><input type="number" id="receiving-qty" step="1" min="1" /></div>
            </div>
            <div class="row">
              <div class="field">
                <label for="receiving-lob">LOB</label>
                <select id="receiving-lob">
                  <option value="">Select LOB</option>
                  <option value="ACP">ACP</option>
                  <option value="GCP">GCP</option>
                  <option value="SCP">SCP</option>
                </select>
              </div>
              <div class="field">
                <label for="receiving-completed">Completed</label>
                <select id="receiving-completed">
                  <option value="YES">YES</option>
                  <option value="NO">NO</option>
                </select>
              </div>
            </div>
            <button type="button" id="receiving-add" class="btn btn-primary">+ Add to List</button>
          </div>

          <div class="pending-list">
            <h3>Items to submit (<span id="receiving-count">0</span>)</h3>
            <div class="table-wrap">
              <table id="receiving-table" class="line-table">
                <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>LOB</th><th>Done</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <button type="button" id="receiving-submit-all" class="btn btn-primary" disabled>Submit All</button>
          </div>
          <div id="msg-receiving" class="msg hidden"></div>
        </div>
      </section>

      <!-- Issuance -->
      <section id="view-issuance" class="view">
        <div class="card">
          <h2>Issuance</h2>
          <a id="issuance-sheet-link" class="sheet-link hidden" href="#" target="_blank" rel="noopener">Open transactions sheet in Smartsheet &#8599;</a>

          <div class="field">
            <label for="issuance-date">Issued/Received Date <span class="hint">(applies to every item below)</span></label>
            <input type="date" id="issuance-date" required />
          </div>

          <div class="field">
            <label for="issuance-requestor">Requestor</label>
            <select id="issuance-requestor">
              <option value="">Select requestor</option>
            </select>
            <div id="requestor-load-error" class="msg error hidden"></div>
          </div>

          <div class="field">
            <label for="issuance-attachment">Attachment <span class="hint">(optional — photo/receipt)</span></label>
            <input type="file" id="issuance-attachment" accept="image/*,.pdf" />
          </div>

          <div class="line-entry">
            <div class="field">
              <label for="issuance-item">Enhanced Item</label>
              <div class="row">
                <input type="text" id="issuance-item" class="item-select" list="itemsDatalist" placeholder="Type to search item..." autocomplete="off" />
                <button type="button" class="btn btn-ghost scan-item-btn" data-target="issuance-item">Scan</button>
              </div>
            </div>
            <div class="row">
              <div class="field"><label for="issuance-unitPrice">Unit Price</label><input type="number" id="issuance-unitPrice" step="0.01" min="0" /></div>
              <div class="field"><label for="issuance-qty">QTY</label><input type="number" id="issuance-qty" step="1" min="1" /></div>
            </div>
            <div class="row">
              <div class="field">
                <label for="issuance-lob">LOB</label>
                <select id="issuance-lob">
                  <option value="">Select LOB</option>
                  <option value="ACP">ACP</option>
                  <option value="GCP">GCP</option>
                  <option value="SCP">SCP</option>
                </select>
              </div>
              <div class="field">
                <label for="issuance-completed">Completed</label>
                <select id="issuance-completed">
                  <option value="YES">YES</option>
                  <option value="NO">NO</option>
                </select>
              </div>
            </div>
            <button type="button" id="issuance-add" class="btn btn-primary">+ Add to List</button>
          </div>

          <div class="pending-list">
            <h3>Items to submit (<span id="issuance-count">0</span>)</h3>
            <div class="table-wrap">
              <table id="issuance-table" class="line-table">
                <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>LOB</th><th>Done</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <button type="button" id="issuance-submit-all" class="btn btn-primary" disabled>Submit All</button>
          </div>
          <div id="msg-issuance" class="msg hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Shared scanner modal, used by all three views -->
  <div id="scannerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="scannerTitle">Scan</h3>
        <button id="closeScanner" class="icon-btn" aria-label="Close">&#10005;</button>
      </div>
      <div id="scannerRegion" class="scanner-box"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
