<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">&#9776;</button>
      <h1>ACP & GCP Inventory</h1>
      <div class="spacer"></div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle light/dark mode">&#127769;</button>
    </header>

    <nav id="sideMenu" class="side-menu">
      <button class="menu-item" data-view="checkStocks">Check Stocks</button>
      <button class="menu-item" data-view="correctStocks">Correct Stocks</button>
      <button class="menu-item" data-view="updateRack">Update Rack</button>
      <button class="menu-item" data-view="barcodeDone">Barcode Done</button>
      <button class="menu-item" data-view="receiving">Receiving</button>
      <button class="menu-item" data-view="issuance">Issuance</button>
      <button class="menu-item" data-view="inventoryControls">Inventory Controls</button>
    </nav>
    <div id="overlay" class="overlay"></div>

    <main id="content">
      <!-- ... existing views ... -->

      <!-- Inventory Controls -->
      <section id="view-inventoryControls" class="view">
        <div class="card">
          <h2>Inventory Controls</h2>
          <p class="hint">System maintenance and barcode utilities.</p>
          
          <div class="field" style="margin-top: 20px;">
            <label>Barcode Utilities</label>
            <div class="row" style="flex-direction: column; gap: 10px;">
              <button id="btn-downloadBarcodes" class="btn btn-ghost" style="width: 100%; text-align: left;">
                📥 Download Barcodes to Drive
                <span class="hint" style="display:block; font-size: 11px;">Saves PNGs for all items to the Google Drive folder.</span>
              </button>
              
              <button id="btn-createBarcodes" class="btn btn-ghost" style="width: 100%; text-align: left;">
                ✨ Create Missing Barcodes in Smartsheet
                <span class="hint" style="display:block; font-size: 11px;">Finds items without barcodes and uploads images to Smartsheet.</span>
              </button>
            </div>
          </div>

          <div class="field" style="margin-top: 20px;">
            <label>Data Sync</label>
            <button id="btn-syncDropdown" class="btn btn-ghost" style="width: 100%; text-align: left;">
              🔄 Update Dropdown Options
              <span class="hint" style="display:block; font-size: 11px;">Syncs Item names to the "Enhanced Item" dropdown in Logs.</span>
            </button>
          </div>

          <div id="msg-controls" class="msg hidden"></div>
        </div>
      </section>
    </main>
  </div>
  
  <div id="scannerModal" class="modal hidden">
    <!-- ... existing scanner code ... -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
